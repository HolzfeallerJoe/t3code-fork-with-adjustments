name: Sync Fork with Upstream (Stable Releases Only)

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force sync even if already on latest stable"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # SYNC_PAT holds the fine-grained PAT named "ForkUpdater" (Contents + Workflows:
          # read & write). A PAT is required because GITHUB_TOKEN cannot push upstream
          # commits that touch .github/workflows/**. See FORK.md.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Register the "ours" merge driver used by .gitattributes to keep the
          # fork's own release workflow file (see /.github/workflows/release.yml)
          git config merge.ours.driver true

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git || true
          git fetch upstream --tags

      - name: Find latest stable release tag
        id: find_stable
        run: |
          # Find latest stable tag (vX.Y.Z format, excluding anything with a hyphen suffix like -nightly, -beta, etc.)
          # Sort by version number descending, take first match
          LATEST_STABLE=$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -z "$LATEST_STABLE" ]; then
            echo "No stable release tags found in upstream"
            echo "has_stable=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest stable release: $LATEST_STABLE"
          echo "latest_tag=$LATEST_STABLE" >> $GITHUB_OUTPUT
          echo "has_stable=true" >> $GITHUB_OUTPUT

      - name: Check if already synced to latest stable
        id: check_changes
        if: steps.find_stable.outputs.has_stable == 'true'
        run: |
          LATEST_TAG="${{ steps.find_stable.outputs.latest_tag }}"
          TAG_COMMIT=$(git rev-parse "$LATEST_TAG^{commit}")

          # Check if this tag's commit is already in our history
          if git merge-base --is-ancestor "$TAG_COMMIT" HEAD; then
            echo "Already synced to $LATEST_TAG (or newer)"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "New stable release $LATEST_TAG available"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        id: merge
        if: steps.find_stable.outputs.has_stable == 'true' && (steps.check_changes.outputs.needs_sync == 'true' || github.event.inputs.force_sync == 'true')
        continue-on-error: true
        run: |
          LATEST_TAG="${{ steps.find_stable.outputs.latest_tag }}"
          IGNORE_PATH=".github/workflows/release.yml"
          echo "Merging stable release $LATEST_TAG..."
          BEFORE_SHA=$(git rev-parse HEAD)

          # Don't let conflicts abort the step; we inspect them below.
          git merge "$LATEST_TAG" --no-edit -m "Merge upstream stable release $LATEST_TAG" || true

          # If anything OTHER than the ignored release workflow conflicted, it's a
          # genuine conflict -> abort and let the conflict handler open an issue.
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ] && [ "$CONFLICTS" != "$IGNORE_PATH" ]; then
            echo "Genuine merge conflict in:"
            echo "$CONFLICTS"
            git merge --abort || true
            exit 1
          fi

          # Force the fork's own state of the release workflow, ignoring upstream.
          # This covers the file being kept, modified, or deleted in the fork,
          # including a modify/delete conflict when upstream changed it.
          if git cat-file -e "$BEFORE_SHA:$IGNORE_PATH" 2>/dev/null; then
            git checkout "$BEFORE_SHA" -- "$IGNORE_PATH"
          else
            git rm -f --ignore-unmatch -- "$IGNORE_PATH"
          fi

          if [ -f .git/MERGE_HEAD ]; then
            # Conflict path: finalize the in-progress merge.
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            # Clean merge that pulled in upstream's release.yml: amend it out.
            echo "Reverted upstream changes to release.yml, amending merge commit"
            git commit --amend --no-edit
          fi
          echo "merge_success=true" >> $GITHUB_OUTPUT

      - name: Check for merge conflicts
        if: steps.merge.outcome == 'failure'
        run: |
          git merge --abort || true
          echo "MERGE_CONFLICT=true" >> $GITHUB_ENV

      - name: Push changes
        if: steps.merge.outcome == 'success'
        run: |
          git push origin main

      - name: Report conflict
        if: env.MERGE_CONFLICT == 'true'
        run: |
          LATEST_TAG="${{ steps.find_stable.outputs.latest_tag }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## ⚠️ Upstream Sync Failed - Manual Merge Required ($LATEST_TAG)"
            echo ""
            echo "The automatic sync with upstream stable release failed due to merge conflicts."
            echo ""
            echo "### What happened"
            echo "- Upstream repository: \`pingdotgg/t3code\`"
            echo "- Attempted to merge: \`$LATEST_TAG\` (stable release)"
            echo "- Result: **Merge conflict detected**"
            echo ""
            echo "### Required action"
            echo "Resolve the conflicts manually:"
            echo ""
            echo '```bash'
            echo "git remote add upstream https://github.com/pingdotgg/t3code.git"
            echo "git fetch upstream --tags"
            echo "git merge $LATEST_TAG"
            echo "# resolve conflicts"
            echo "git add ."
            echo "git commit -m \"Merge upstream stable release $LATEST_TAG\""
            echo "git push origin main"
            echo '```'
            echo ""
            echo "[View workflow run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream sync conflict for $LATEST_TAG - manual merge required. See run summary: $RUN_URL"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.find_stable.outputs.has_stable }}" == "false" ]; then
            echo "⚠️ No stable release tags found in upstream" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.needs_sync }}" == "false" ]; then
            echo "✅ Fork is already synced to latest stable release (${{ steps.find_stable.outputs.latest_tag }})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ env.MERGE_CONFLICT }}" == "true" ]; then
            echo "❌ Merge conflict detected for ${{ steps.find_stable.outputs.latest_tag }} - manual intervention required" >> $GITHUB_STEP_SUMMARY
            echo "See the conflict report above and the run logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Successfully synced to upstream stable release ${{ steps.find_stable.outputs.latest_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
